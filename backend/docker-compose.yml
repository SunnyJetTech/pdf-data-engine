version: "3.9"

services:

  backend:

    build: .

    container_name: pdf-backend

    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - mongodb

    volumes:
      - .:/app

  postgres:

    image: postgres:16

    container_name: pdf-postgres

    restart: always

    environment:
      POSTGRES_DB: pdfdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:

    image: mongo:8

    container_name: pdf-mongo

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:

  postgres_data:

  mongo_data: